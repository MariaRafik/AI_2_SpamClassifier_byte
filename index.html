<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Phishing Simulator Terminal</title>
    
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    
    <style>
        body { background-color: #121212; color: white; font-family: sans-serif; padding: 20px; }
        h2 { color: #00ffcc; }
        p { color: #aaaaaa; }
    </style>
</head>
<body>
    <h2>AVIP Task 2: Phishing Simulator</h2>
    <p>Loading AI model and dataset... (This takes a few seconds)</p>

    <py-config>
        packages = ["pandas", "scikit-learn"]
        [[fetch]]
        files = ["./spam_ham_dataset.csv", "./spam.py"]
    </py-config>

    <!-- THE FIX: Added the 'worker' attribute here so the input() command doesn't freeze the browser -->
    <script type="py" src="./spam.py" terminal worker></script>
</body>
</html>
